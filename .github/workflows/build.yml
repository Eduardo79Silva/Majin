name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Vulkan SDK
      run: |
        sudo apt update
        sudo apt install -y libvulkan-dev vulkan-validationlayers glslang-tools libshaderc-dev
    
    - name: Install dependencies
      run: |
        sudo apt install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
          libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
    
    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DVulkan_GLSLC_EXECUTABLE=/usr/bin/glslangValidator
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: majin-linux
        path: |
          build/app
          shaders/*.spv

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Vulkan
      uses: humbletim/setup-vulkan-sdk@v1.2.0
      with:
        vulkan-query-version: latest
        vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Glslang
        vulkan-use-cache: true
      
    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: majin-windows
        path: |
          build/Release/app.exe
          shaders/*.spv
