name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Vulkan SDK
      run: |
        sudo apt update
        sudo apt install -y libvulkan-dev vulkan-validationlayers glslang-tools libshaderc-dev
    
    - name: Install dependencies
      run: |
        sudo apt install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
          libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
    
    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DVulkan_GLSLC_EXECUTABLE=$(which glslc)
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: majin-linux
        path: |
          build/app
          shaders/*.spv

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Vulkan
      run: |
        choco install vulkan-sdk -y
        echo "VULKAN_SDK=C:\VulkanSDK\1.3.290.0" >> $env:GITHUB_ENV
        echo "C:\VulkanSDK\1.3.290.0\Bin" >> $env:GITHUB_PATH
      
    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: majin-windows
        path: |
          build/Release/app.exe
          shaders/*.spv
